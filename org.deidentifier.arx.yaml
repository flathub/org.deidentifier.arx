app-id: org.deidentifier.arx
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk
  - org.freedesktop.Sdk.Extension.rust-stable

command: arx
finish-args:
  - --socket=x11
#  - --device=dri
  - --share=ipc
  # network: the app can connect to DBMS
  - --share=network
  - --env=PATH=/usr/bin:/app/bin:/app/jre/bin
  - --env=JAVA_HOME=/app/jre
  - --env=GDK_PIXBUF_MODULE_FILE=/app/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache
  - --env=LD_LIBRARY_PATH=/app/lib

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    JAVA_HOME: /usr/lib/sdk/openjdk/
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk/install.sh

  - name: gdk-pixbuf-loaders
    buildsystem: meson
    config-opts:
      - -Dpng=enabled
      - -Dgif=enabled
      - -Djpeg=disabled
      - -Dtiff=disabled
      - -Dothers=disabled
      - -Dbuiltin_loaders=none
      - -Dintrospection=disabled
      - -Dman=false
      - -Dgtk_doc=false
      - -Dtests=false
      - -Dinstalled_tests=false
      - -Dgio_sniffing=false
    post-install:
      - gdk-pixbuf-query-loaders /app/lib/gdk-pixbuf-2.0/2.10.0/loaders/libpixbufloader-png.so /app/lib/gdk-pixbuf-2.0/2.10.0/loaders/libpixbufloader-gif.so > /app/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gdk-pixbuf/2.42/gdk-pixbuf-2.42.12.tar.xz
        sha256: b9505b3445b9a7e48ced34760c3bcb73e966df3ac94c95a148cb669ab748e3c7
        x-checker-data:
          type: gnome
          name: gdk-pixbuf
          stable-only: true
          versions:
            "<": "2.44.0"

  - name: librsvg
    buildsystem: meson
    build-options:
      env:
        CARGO_HOME: /run/build/librsvg/cargo
        CARGO_NET_OFFLINE: "true"
    config-opts:
      - -Dpixbuf=enabled
      - -Dpixbuf-loader=enabled
      - -Drsvg-convert=disabled
      - -Dintrospection=disabled
      - -Dvala=disabled
      - -Ddocs=disabled
      - -Dtests=false
      - -Davif=disabled
    post-install:
      - gdk-pixbuf-query-loaders /app/lib/gdk-pixbuf-2.0/2.10.0/loaders/libpixbufloader-png.so /app/lib/gdk-pixbuf-2.0/2.10.0/loaders/libpixbufloader-gif.so /app/lib/gdk-pixbuf-2.0/2.10.0/loaders/libpixbufloader_svg.so > /app/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache
    sources:
      - type: archive
        url: https://download.gnome.org/sources/librsvg/2.63/librsvg-2.63.2.tar.xz
        sha256: 852b18e1a00b8605528825a27dc7748bff2a5dd254028f59dc22a34ea57e81b6
        x-checker-data:
          type: gnome
          name: librsvg
          stable-only: true
      # Regenerate by downloading the matching librsvg-x.y.z.tar.xz above, then:
      #   python3 flatpak-cargo-generator.py librsvg-x.y.z/Cargo.lock -o cargo-sources.json
      # flatpak-cargo-generator.py: https://github.com/flatpak/flatpak-builder-tools/blob/master/cargo/flatpak-cargo-generator.py
      - cargo-sources.json

  - name: arx-binary
    buildsystem: simple
    build-commands:
      - install -D -ma+rx arx.sh /app/bin/arx
      - install -D -ma+r arx-gtk-64.jar /app/bin/arx-gtk-64.jar
      - install -D -ma+r org.deidentifier.arx.desktop /app/share/applications/org.deidentifier.arx.desktop
      - install -D -ma+r org.deidentifier.arx.appdata.xml /app/share/metainfo/org.deidentifier.arx.appdata.xml
      - install -D -ma+r org.deidentifier.arx.svg /app/share/icons/hicolor/scalable/apps/org.deidentifier.arx.svg
      - install -D -ma+r org.deidentifier.arx.png /app/share/icons/hicolor/128x128/apps/org.deidentifier.arx.png

    sources:
      - type: file
        path: arx.sh

      - type: file
        path: org.deidentifier.arx.appdata.xml

      - type: file
        path: org.deidentifier.arx.desktop

      - type: file
        path: org.deidentifier.arx.png

      - type: file
        path: org.deidentifier.arx.svg

      - type: file
        url: https://github.com/arx-deidentifier/arx/releases/download/v3.9.2/arx-3.9.2-gtk-64.jar
        sha256: e50a472b7aad158cae7fef86fb4baf85a1f5c2982a97ab8c77e73cf9535368b7
        dest-filename: arx-gtk-64.jar
        x-checker-data:
          type: json
          url: https://api.github.com/repos/arx-deidentifier/arx/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name | contains ("gtk-64.jar")) | .browser_download_url
